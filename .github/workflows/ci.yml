name: CI

# Runs the tracked, credential-free test suite on every supported Python.
# Independent of release.yml: a failing run here does not block a release, but
# it is the signal that master is broken.

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # setup.cfg declares python_requires >= 3.11.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Test (no provider credentials)
        # Empty values take precedence over the placeholder .env.test; setup.cfg
        # already deselects needs_api/credential_gated, repeated here for clarity.
        env:
          OPENAI_API_KEY: ""
          OPENROUTER_API_KEY: ""
          SERPER_API_KEY: ""
          JINA_API_KEY: ""
        run: >-
          python -m pytest --strict-config --strict-markers tests/ --timeout=30
          -m 'not needs_api and not credential_gated'
