[metadata]
name = magic_agents
version = attr: magic_agents.__version__
author = Andres
author_email = andres@arz.ai
description = Agent builder5
keywords = llm

[options]
zip_safe = True
include_package_data = True
packages = find:
package_dir =
    = .
python_requires = >=3.11
install_requires =
    aiohttp>=3.14.5,<4
    anyio>=4.10,<5
    Jinja2>=3.1.6,<4
    jsonschema>=4.23,<5
    magic_llm @ git+https://github.com/Andres77872/magic-llm.git@master
    MarkupSafe>=3.0.2,<4
    networkx>=3.4.2,<4
    pydantic>=2.12,<3
    tiktoken>=0.9,<1
    yarl>=1.25.1,<2
    # Qualify these together with NodeMcp.coordination_external_transport_versions.
    mcp==2.3.0
    mcp-types==2.3.0
    httpx2==2.16.2

[options.extras_require]
pdf =
    pdf-inspector>=1.25.2,<2
redis =
    redis>=5,<9
qdrant =
    qdrant-client>=1.10.0,<2
test =
    coverage>=7.6,<8
    pytest>=8.4,<10
    pytest-asyncio>=0.24,<2
    pytest-timeout>=2.3.1,<3

[options.packages.find]
where = .
include =
    magic_agents
    magic_agents.*

[tool:pytest]
addopts = --import-mode=importlib
markers =
    needs_api: marks tests that require real API keys (OpenAI, Serper)
    smoke: marks safe smoke validation tests
    build_only: marks build-only example validation tests
    credential_free: marks examples executable without provider credentials
    credential_gated: marks live/provider examples gated by environment variables
    slow: marks tests that are slow-running (deselect with '-m "not slow"')
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

[coverage:run]
branch = True
concurrency = thread
relative_files = True
source = magic_agents

[coverage:report]
precision = 2
show_missing = True
skip_covered = True
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
